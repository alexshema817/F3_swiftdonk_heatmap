<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swift Donkey</title>
<link rel="icon" type="image/png" href="/images/f3_favicon.png">
<link rel="apple-touch-icon" href="/images/f3_favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff4d00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swift Donkey">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --accent: #ff4d00;
    --accent2: #ffaa00;
    --hot: #ff2200;
    --warm: #ff6600;
    --cool: #0066ff;
    --text: #e8e8e8;
    --muted: #555;
    --mono: 'Space Mono', monospace;
    --display: 'Bebas Neue', cursive;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    overscroll-behavior: none; /* prevent pull-to-refresh interfering with map */
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 300px 1fr;
    grid-template-areas:
      "header header"
      "sidebar map"
      "footer footer";
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 100;
  }

  .logo {
    font-family: var(--display);
    font-size: 1.8rem;
    letter-spacing: 0.08em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-text { line-height: 1; }
  .logo-sub {
    font-family: var(--mono);
    font-size: 0.5rem;
    letter-spacing: 0.25em;
    color: var(--muted);
    margin-top: 2px;
  }

  .header-stats { display: flex; gap: 28px; }

  .stat { text-align: right; }
  .stat-val {
    font-family: var(--display);
    font-size: 1.5rem;
    color: var(--accent);
    line-height: 1;
  }
  .stat-label {
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── SIDEBAR ── */
  aside {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Loading bar at top of sidebar */
  .load-bar {
    height: 2px;
    background: var(--border);
    flex-shrink: 0;
    overflow: hidden;
  }
  .load-bar-inner {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  .section-title {
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-count {
    background: var(--border);
    color: var(--muted);
    font-size: 0.5rem;
    padding: 1px 5px;
    border-radius: 8px;
  }

  .file-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    -webkit-overflow-scrolling: touch;
    min-height: 0; /* critical for flex scroll */
  }

  .file-item {
    display: flex;
    align-items: center;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
    font-size: 0.65rem;
    cursor: pointer;
    transition: background 0.1s;
  }
  .file-item:hover { background: rgba(255,255,255,0.04); }
  .file-item:active { background: rgba(255,77,0,0.08); }

  .select-all-row { background: rgba(255,77,0,0.05); }

  .file-check {
    width: 16px; height: 16px;
    border: 1.5px solid var(--muted);
    border-radius: 3px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, background 0.15s;
    cursor: pointer;
  }
  .file-check.checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .file-check.checked::after {
    content: '✓';
    font-size: 0.6rem;
    color: #fff;
    line-height: 1;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .file-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .file-name {
    flex: 1;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-dist {
    color: var(--muted);
    font-size: 0.55rem;
    flex-shrink: 0;
  }

  /* ── LEGEND ── */
  .legend {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .legend-title {
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .legend-bar {
    height: 7px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--cool), var(--warm), var(--hot));
    margin-bottom: 4px;
  }
  .legend-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.55rem;
    color: var(--muted);
  }

  /* ── CONTROLS ── */
  .controls {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  .control-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .control-label {
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    width: 56px;
    flex-shrink: 0;
  }
  .control-val {
    font-family: var(--display);
    font-size: 1rem;
    color: var(--accent);
    width: 30px;
    text-align: center;
    flex-shrink: 0;
  }
  .stepper {
    display: flex; align-items: center; gap: 6px; flex: 1;
  }
  .step-btn {
    background: var(--border);
    color: var(--text);
    border: none;
    width: 40px; height: 40px;
    border-radius: 4px;
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .step-btn:hover { background: #333; }
  .step-btn:active { background: var(--accent); transform: scale(0.93); }
  .step-track {
    flex: 1; height: 3px;
    background: var(--border);
    border-radius: 2px; overflow: hidden;
  }
  .step-fill {
    height: 100%; background: var(--accent);
    border-radius: 2px; transition: width 0.15s;
  }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 14px;
    font-family: var(--display);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s, transform 0.1s;
    width: 100%;
  }
  .btn:hover { background: #ff6622; }
  .btn:active { transform: scale(0.98); }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn.secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* ── MAP ── */
  #map { grid-area: map; z-index: 1; position: relative; }

  /* map stays in normal light mode */
  .leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  .empty-icon { font-size: 2.5rem; opacity: 0.12; margin-bottom: 10px; }
  .empty-text {
    font-family: var(--display);
    font-size: 1.6rem;
    letter-spacing: 0.1em;
    opacity: 0.12;
  }
  .empty-sub {
    font-size: 0.6rem;
    color: var(--muted);
    opacity: 0.5;
    margin-top: 4px;
    letter-spacing: 0.15em;
  }

  /* ── FOOTER ── */
  footer {
    grid-area: footer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .status { display: flex; align-items: center; gap: 6px; }
  .status-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent2);
  }
  .status-dot.loading {
    background: var(--accent);
    animation: blink 0.8s infinite;
  }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }

  /* ── TOOLTIP ── */
  .map-tooltip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.6rem;
    padding: 5px 8px;
    border-radius: 2px;
  }

  /* ── COFFEE POPUP ── */
  .coffee-popup .leaflet-popup-content-wrapper {
    background: #111;
    border: 1px solid #333;
    border-radius: 3px;
    box-shadow: 0 0 16px rgba(255,77,0,0.25);
  }
  .coffee-popup .leaflet-popup-tip {
    background: #111;
  }
  .coffee-popup .leaflet-popup-content {
    margin: 8px 12px;
  }

  /* ── MOBILE DRAWER TOGGLE ── */
  #drawer-toggle {
    display: none;
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 10px 22px;
    font-family: var(--display);
    font-size: 0.95rem;
    letter-spacing: 0.1em;
    box-shadow: 0 4px 20px rgba(255,77,0,0.45);
    cursor: pointer;
    white-space: nowrap;
  }

  /* ── MOBILE (≤ 640px) ── */
  @media (max-width: 640px) {

    body {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header"
        "map"
        "footer";
    }

    header { padding: 8px 14px; }
    .logo svg { width: 28px; height: 28px; }
    .logo { font-size: 1.2rem; gap: 8px; }
    .logo-sub { display: none; }
    .header-stats { gap: 14px; }
    .stat-val { font-size: 1.1rem; }
    .stat-label { font-size: 0.45rem; }

    footer { padding: 4px 14px; font-size: 0.5rem; }
    footer span:last-child { display: none; }

    /* Sidebar = slide-up bottom drawer */
    aside {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 65vh;
      max-height: 65vh;
      border-right: none;
      border-top: 2px solid var(--accent);
      border-radius: 16px 16px 0 0;
      z-index: 400;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
      box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
    }
    aside.open { transform: translateY(0); }

    /* Drag handle */
    aside::before {
      content: '';
      display: block;
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 10px auto 4px;
      flex-shrink: 0;
    }

    #drawer-toggle { display: block; }
    #map { grid-area: map; }

    /* Larger touch targets */
    .file-item { padding: 12px 16px; font-size: 0.7rem; }
    .file-dot { width: 9px; height: 9px; }
    .controls { padding: 12px 16px; }
    .btn { padding: 12px; font-size: 1rem; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>

    <img src="/images/f3_favicon.png" alt="F3 Swift Donkey" style="width:38px;height:38px;object-fit:contain;flex-shrink:0;">

      <div>SWIFT DONKEY</div>
      <div class="logo-sub">RUN HEATMAP</div>

  <div class="header-stats">

      <div class="stat-val" id="stat-runs">—</div>

    <div class="stat">

<!-- SIDEBAR -->
<aside>
  <div class="load-bar"><div class="load-bar-inner" id="load-bar"></div></div>

      <span>Once</span>

        <div class="step-track"><div class="step-fill" id="opacity-fill" style="width:70%"></div></div>

      <span class="control-val" id="opacity-val">70%</span>
    </div>
    <div class="control-row">
      <span class="control-label">Weight</span>
      <div class="stepper">
        <button class="step-btn" id="weight-down">−</button>
        <div class="step-track"><div class="step-fill" id="weight-fill" style="width:29%"></div></div>
        <button class="step-btn" id="weight-up">+</button>

</aside>

<!-- MAP -->
<div id="map">
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">🗺️</div>
    <div class="empty-text">Loading Routes...</div>
    <div class="empty-sub">Fetching GPX files from GitHub</div>
  </div>
</div>

<!-- MOBILE DRAWER TOGGLE -->
<button id="drawer-toggle">☰ RUNS</button>

<!-- FOOTER -->
<footer>
  <div class="status">
    <div class="status-dot loading" id="status-dot"></div>
    <span id="status-text">Connecting to GitHub...</span>
  </div>
  <span>alexshema817 / F3_swiftdonk_heatmap / map_files</span>

<script>
// ── Config ─────────────────────────────────────────────────────────────────
const GITHUB_USER   = 'alexshema817';
const GITHUB_REPO   = 'F3_swiftdonk_heatmap';
const RAW_BASE      = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/map_files`;
const API_BASE      = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/map_files`;

// ── State ──────────────────────────────────────────────────────────────────
const state = {
  activities: [],
  segmentMap: new Map(),
  heatLayers: [],
};

let opacityVal = 0.7;
let weightVal  = 3;

// ── Map ────────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true, attributionControl: false })
  .setView([37.2506205, -79.9484836], 15); // Sweet Donkey Coffee, exact coords

// Coffee cup marker at Sweet Donkey Coffee
const coffeeIcon = L.divIcon({
  className: '',
  html: `
    <div style="position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;">
      <div style="
        position:absolute;inset:0;
        border-radius:50%;
        background:rgba(255,30,0,0.35);
        animation:coffeeRing 1.5s ease-out infinite;
      "></div>
      <div style="
        position:absolute;inset:4px;
        border-radius:50%;
        background:rgba(255,30,0,0.5);
        animation:coffeeRing 1.5s ease-out infinite 0.4s;
      "></div>
      <div style="
        position:relative;
        width:32px;height:32px;
        border-radius:50%;
        background:#cc0000;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 0 10px rgba(255,0,0,0.7);
        font-size:1.2rem;
        z-index:1;
      ">☕</div>
    </div>
    <style>
      @keyframes coffeeRing {
        0%   { transform:scale(0.8); opacity:0.8; }
        100% { transform:scale(1.6); opacity:0; }
      }
    </style>
  `,
  iconAnchor: [22, 22],
  popupAnchor: [0, -24],
});

L.marker([37.2506205, -79.9484836], { icon: coffeeIcon })
  .addTo(map)
  .bindPopup(`
    <div style="font-family:'Space Mono',monospace;font-size:0.7rem;line-height:1.6;color:#e8e8e8;background:#111;padding:4px 2px;text-align:center;">
      <div style="font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:0.1em;color:#ff4d00">Let's Get that Black Gold! ☕</div>
      <div style="color:#555;font-size:0.6rem;margin-top:2px">2108 Broadway Ave SW, Roanoke, VA</div>
      <a href="https://maps.google.com/?q=37.2506205,-79.9484836" target="_blank" style="display:inline-block;margin-top:6px;color:#ff4d00;font-size:0.6rem;letter-spacing:0.1em;text-decoration:none;">▶ NAVIGATE</a>
    </div>
  `, { className: 'coffee-popup' })
  .openPopup();

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

// ── Colors ─────────────────────────────────────────────────────────────────
const PALETTE = [
  '#ff4d00','#ff9900','#00ccff','#00ff88',
  '#ff00aa','#aa00ff','#ffff00','#00ffcc',
  '#ff6688','#66ffaa','#ffcc00','#0099ff'
];
function getColor(i) { return PALETTE[i % PALETTE.length]; }

function freqColor(count, max) {
  if (max <= 1) return '#0066ff';
  const t = Math.min((count - 1) / (max - 1), 1);
  const r = Math.round(t * 255);
  const g = Math.round(102 - t * 102);
  const b = Math.round(255 - t * 255);
  return `rgb(${r},${g},${b})`;
}

// ── GPX Parser ─────────────────────────────────────────────────────────────
function parseGPX(text, filename) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const coords = [];
  doc.querySelectorAll('trkpt,rtept').forEach(pt => {
    const lat = parseFloat(pt.getAttribute('lat'));
    const lon = parseFloat(pt.getAttribute('lon'));
    if (!isNaN(lat) && !isNaN(lon)) coords.push([lat, lon]);
  });

  // Try to get date from <time> element inside the track
  let name = '';
  const timeEl = doc.querySelector('trkpt time, trk time, metadata time, time');
  if (timeEl) {
    const d = new Date(timeEl.textContent.trim());
    if (!isNaN(d)) {
      name = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
  }
  // Fallback: try to parse date from filename (e.g. 2024-03-15.gpx)
  if (!name) {
    const match = filename.match(/(\d{4}-\d{2}-\d{2})/);
    if (match) {
      const d = new Date(match[1]);
      if (!isNaN(d)) {
        name = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }
    }
  }
  // Final fallback: just use filename
  if (!name) name = filename.replace('.gpx','').replace(/_/g,' ');

  return { name, coords };
}

// ── Distance ───────────────────────────────────────────────────────────────
function haversine([a, b], [c, d]) {
  const R = 6371, dL = (c-a)*Math.PI/180, dO = (d-b)*Math.PI/180;
  const x = Math.sin(dL/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dO/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
function totalDist(coords) {
  let d = 0;
  for (let i = 1; i < coords.length; i++) d += haversine(coords[i-1], coords[i]);
  return d;
}

// ── Segment heatmap ────────────────────────────────────────────────────────
function snap([lat, lon]) {
  return [Math.round(lat * 1000)/1000, Math.round(lon * 1000)/1000];
}
function segKey(a, b) {
  const [a1, a2] = snap(a), [b1, b2] = snap(b);
  const k1 = `${a1},${a2}`, k2 = `${b1},${b2}`;
  return k1 < k2 ? `${k1}|${k2}` : `${k2}|${k1}`;
}
function registerSegments(coords) {
  for (let i = 1; i < coords.length; i++) {
    const k = segKey(coords[i-1], coords[i]);
    state.segmentMap.set(k, (state.segmentMap.get(k) || 0) + 1);
  }
}

// ── Render ─────────────────────────────────────────────────────────────────
// Use a single canvas-based polyline per activity instead of one layer per segment
// Segment frequency shown via color only — tooltips on canvas are lightweight

const canvasRenderer = L.canvas({ padding: 0.5 });

function renderAll() {
  state.heatLayers.forEach(l => map.removeLayer(l));
  state.heatLayers = [];

  const active = state.activities.filter(a => a.visible);
  if (!active.length) { updateStats(); return; }

  // Rebuild segment map from visible activities only
  const visibleSegMap = new Map();
  active.forEach(act => {
    for (let i = 1; i < act.coords.length; i++) {
      const k = segKey(act.coords[i-1], act.coords[i]);
      visibleSegMap.set(k, (visibleSegMap.get(k) || 0) + 1);
    }
  });

  const max = Math.max(...visibleSegMap.values(), 1);

  // Group segments by frequency bucket for fewer layers (10 buckets)
  const BUCKETS = 10;
  const buckets = Array.from({length: BUCKETS}, () => []);

  active.forEach(act => {
    for (let i = 1; i < act.coords.length; i++) {
      const k = segKey(act.coords[i-1], act.coords[i]);
      const count = visibleSegMap.get(k) || 1;
      const bucket = Math.min(Math.floor((count - 1) / max * BUCKETS), BUCKETS - 1);
      buckets[bucket].push([act.coords[i-1], act.coords[i]]);
    }
  });

  buckets.forEach((segs, bi) => {
    if (!segs.length) return;
    const t = bi / (BUCKETS - 1);
    const r = Math.round(t * 255);
    const g = Math.round(102 - t * 102);
    const b = Math.round(255 - t * 255);
    const pl = L.polyline(segs, {
      color: `rgb(${r},${g},${b})`,
      weight: weightVal,
      opacity: opacityVal,
      renderer: canvasRenderer,
      interactive: false, // no per-segment tooltips — big perf win
    }).addTo(map);
    state.heatLayers.push(pl);
  });

  updateStats();
}

function updateStats() {
  const active = state.activities.filter(a => a.visible);
  document.getElementById('stat-runs').textContent     = active.length + '/' + state.activities.length;
  const totalKm = active.reduce((s,a)=>s+a.dist,0);
  document.getElementById('stat-dist').textContent     = (totalKm * 0.621371).toFixed(1);
  // count unique segments from visible
  const seg = new Set();
  active.forEach(a => {
    for (let i = 1; i < a.coords.length; i++) seg.add(segKey(a.coords[i-1], a.coords[i]));
  });
  document.getElementById('stat-segments').textContent = seg.size;
}

// ── File list UI ───────────────────────────────────────────────────────────
function renderFileList() {
  const el = document.getElementById('file-list');
  document.getElementById('file-count').textContent = state.activities.length;

  el.innerHTML = `
    <div class="file-item select-all-row" id="select-all-row">
      <div class="file-check ${state.activities.every(a=>a.visible) ? 'checked' : ''}" id="select-all-check"></div>
      <div class="file-name" style="color:var(--accent);font-size:0.6rem;letter-spacing:0.1em">ALL ROUTES</div>
    </div>
    ${state.activities.map((a,i) => `
      <div class="file-item" data-idx="${i}">
        <div class="file-check ${a.visible ? 'checked' : ''}" data-idx="${i}"></div>
        <div class="file-dot" style="background:${a.color}"></div>
        <div class="file-name" title="${a.name}">${a.name}</div>
        <div class="file-dist">${(a.dist * 0.621371).toFixed(1)}mi</div>
      </div>
    `).join('')}
  `;

  // Select all toggle
  el.querySelector('#select-all-check').addEventListener('click', () => {
    const allOn = state.activities.every(a => a.visible);
    state.activities.forEach(a => a.visible = !allOn);
    renderFileList();
    renderAll();
  });

  // Individual toggles
  el.querySelectorAll('.file-check[data-idx]').forEach(ch => {
    ch.addEventListener('click', () => {
      const i = parseInt(ch.dataset.idx);
      state.activities[i].visible = !state.activities[i].visible;
      renderFileList();
      renderAll();
    });
  });
}

function fitAll() {
  const active = state.activities.filter(a => a.visible);
  if (!active.length) return;
  const all = active.flatMap(a => a.coords);
  if (all.length) map.fitBounds(L.latLngBounds(all), { padding: [40,40] });
}

// ── Status helpers ─────────────────────────────────────────────────────────
function setStatus(msg, done = false) {
  document.getElementById('status-text').textContent = msg;
  if (done) {
    document.getElementById('status-dot').classList.remove('loading');
  }
}

function setProgress(pct) {
  document.getElementById('load-bar').style.width = pct + '%';
}

// ── GitHub fetch ───────────────────────────────────────────────────────────
async function fetchGPXList() {
  setStatus('Fetching file list from GitHub...');
  const res = await fetch(API_BASE);
  if (!res.ok) throw new Error(`GitHub API ${res.status}: ${res.statusText}`);
  const files = await res.json();
  return files.filter(f => f.name.toLowerCase().endsWith('.gpx'));
}

async function fetchAndParse(file, index, total) {
  setStatus(`Loading ${index + 1} / ${total} — ${file.name}`);
  setProgress(((index + 1) / total) * 100);

  // Use download_url directly from GitHub API — already correctly encoded
  const url = file.download_url;
  if (!url) throw new Error(`No download_url for ${file.name}`);
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Failed to fetch ${file.name}: ${res.status}`);
  const text = await res.text();
  return parseGPX(text, file.name);
}

async function loadAllFromGitHub() {
  try {
    const files = await fetchGPXList();

    if (files.length === 0) {
      setStatus('No GPX files found in /gpx folder yet', true);
      document.getElementById('empty-state').querySelector('.empty-text').textContent = 'No Files Yet';
      document.getElementById('empty-state').querySelector('.empty-sub').textContent  = 'Add GPX files to the /Map Files folder in GitHub';
      return;
    }

    setStatus(`Found ${files.length} GPX file${files.length > 1 ? 's' : ''} — loading...`);

    // Fetch all in parallel batches of 5 to avoid hammering
    const BATCH = 10;
    let loaded = 0;
    for (let i = 0; i < files.length; i += BATCH) {
      const batch = files.slice(i, i + BATCH);
      const results = await Promise.allSettled(
        batch.map((f, bi) => fetchAndParse(f, i + bi, files.length))
      );
      results.forEach((r, bi) => {
        if (r.status === 'fulfilled' && r.value.coords.length >= 2) {
          const { name, coords } = r.value;
          const color = getColor(state.activities.length);
          const dist  = totalDist(coords);
          state.activities.push({ id: `${i+bi}`, name, color, coords, dist, visible: true });
          registerSegments(coords);
          loaded++;
        }
      });
      // Update sidebar list progressively, defer expensive map render to end
      renderFileList();
      setStatus(`Loaded ${loaded} / ${files.length}...`);
    }

    setProgress(100);
    document.getElementById('empty-state').style.display = 'none';

    // Single render after all files are loaded
    renderAll();
    fitAll();
    setStatus(`${loaded} activit${loaded !== 1 ? 'ies' : 'y'} loaded — ${state.segmentMap.size} road segments`, true);

    setTimeout(() => setProgress(0), 800);

  } catch (err) {
    setStatus(`Error: ${err.message}`, true);
    const es = document.getElementById('empty-state');
    es.style.display = 'block';
    es.querySelector('.empty-icon').textContent = '⚠️';
    es.querySelector('.empty-text').textContent = 'Load Error';
    es.querySelector('.empty-sub').textContent  = err.message;
    es.style.opacity = '1';
    es.querySelector('.empty-text').style.opacity = '1';
    es.querySelector('.empty-sub').style.opacity = '1';
  }
}

// ── Controls ───────────────────────────────────────────────────────────────
let opacityPct = 70; // 10–100
let weightStep = 3;  // 1–8

function updateOpacity() {
  opacityVal = opacityPct / 100;
  document.getElementById('opacity-val').textContent = opacityPct + '%';
  document.getElementById('opacity-fill').style.width = opacityPct + '%';
  state.heatLayers.forEach(l => l.setStyle({ opacity: opacityVal }));
}
function updateWeight() {
  weightVal = weightStep;
  document.getElementById('weight-val').textContent = weightStep;
  document.getElementById('weight-fill').style.width = ((weightStep - 1) / 7 * 100) + '%';
  state.heatLayers.forEach(l => l.setStyle({ weight: weightVal }));
}

document.getElementById('opacity-down').addEventListener('click', () => { opacityPct = Math.max(10, opacityPct - 10); updateOpacity(); });
document.getElementById('opacity-up').addEventListener('click',   () => { opacityPct = Math.min(100, opacityPct + 10); updateOpacity(); });
document.getElementById('weight-down').addEventListener('click',  () => { weightStep = Math.max(1, weightStep - 1); updateWeight(); });
document.getElementById('weight-up').addEventListener('click',    () => { weightStep = Math.min(8, weightStep + 1); updateWeight(); });

document.getElementById('fit-btn').addEventListener('click', fitAll);
document.getElementById('refresh-btn').addEventListener('click', () => window.location.reload(true));

// ── Mobile drawer ──────────────────────────────────────────────────────────
const drawerToggle = document.getElementById('drawer-toggle');
const sidebar = document.querySelector('aside');

drawerToggle.addEventListener('click', () => {
  const isOpen = sidebar.classList.toggle('open');
  drawerToggle.textContent = isOpen ? '✕ CLOSE' : '☰ RUNS';
});

// Tap map to close drawer
document.getElementById('map').addEventListener('click', () => {
  sidebar.classList.remove('open');
  drawerToggle.textContent = '☰ RUNS';
});

// ── PWA Service Worker — unregister any cached SW to prevent stale content ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(reg => reg.unregister());
  });
}

// ── Boot ───────────────────────────────────────────────────────────────────
loadAllFromGitHub();
</script>
